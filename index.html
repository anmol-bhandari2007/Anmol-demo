<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AB Store</title>
</head>
<body>
    <header>
        <div class="navbar">
            <div class="nav-logo border">
                <a href="" target="_blank"><div class="logo"></div></a>
            </div>
            <div class="nav-address">
                <p class="add-first"><a href="" target="_blank">Deliver to</a></p>
                <div class="add-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="add-sec">Nepal</p>
                </div>
            </div>
             <div class="nav-search">
                <select class="search-select">
                    <option>All</option>
                </select>
                <input placeholder="Search" class="search-input">
                <div class="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
             </div>
              <div class="nav-signin">
                    <p><span>Hello, sign in</span></p>
                    <p class="nav-second">Account & Lists</p>

                </div>
                <div class="nav-order">
                <div class="return">
                    Returns 
                    <div class="order">& Orders</div>
                   </div>
                </div>
                <div class="card-icon">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <p class="cart">Cart</p>
                </div>
                   

                </div> 
                <div class="panel">
                    <div class="panel-all">
                        <i class="fa-solid fa-bars"></i>
                        All
                    </div>
                    <div class="panel-ops">
                        <p>Today's Deals</p>
                        <p>Customer Service</p>
                        <p>Registry</p>
                        <p>Gift Cards</p>
                        <p>Sell</p>
                    </div>
                    <div class="panel-deals">
                        Shop deals in Electronics
                    </div>
                </div>
                
    </header>
    <div class="hero-section">
        
    
    <div class="shop-section">
        <div class="box1 box">
    
           <div class="box-img1"></div>
           <h2 class="head">Gaming</h2> 
           <p class="see-more">See more
            <i class="fa-solid fa-arrow-right-long"></i>
           </p>
        </div>
        <div class="box2 box">
        
            <div class="box-img2"></div>
            <h2 class="head">Foldable</h2>
         <p class="see-more">See more
            <i class="fa-solid fa-arrow-right-long"></i></p>
        </div>


        <div class="box3 box">
            <div class="box-img3"></div>
              <h2 class="head">Apple</h2>
            <p class="see-more">See more
                <i class="fa-solid fa-arrow-right-long"></i>
            </p>
        </div>
        <div class="box4 box">
            
            <div class="box-img4"></div>
            <h2 class="head">Samsung</h2>
            <p class="see-more">See more
                <i class="fa-solid fa-arrow-right-long"></i>
            </p>
        </div>
    </div>
    </div>
</body>
</html>
